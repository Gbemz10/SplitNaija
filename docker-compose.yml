services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: splitnaija
      POSTGRES_PASSWORD: splitnaija
      POSTGRES_DB: splitnaija
    ports:
      - "5432:5432"
    volumes:
      - splitnaija_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitnaija"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  splitnaija_pgdata:
